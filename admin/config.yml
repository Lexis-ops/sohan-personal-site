backend:
  name: git-gateway
  branch: main

media_folder: "src/assets/uploads"
public_folder: "/assets/uploads"

publish_mode: simple

collections:
  - name: "essays"
    label: "Essays"
    folder: "src/essays"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "essay.njk" }
      - { label: "Title", name: "title", widget: "string" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Productivity", "Technology & Law", "Entrepreneurship", "Leadership", "Identity", "Bangladesh", "Society"]
      - { label: "Excerpt", name: "excerpt", widget: "text", hint: "Short summary shown on the homepage card (1–2 sentences)." }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "documents"
    label: "Documents"
    folder: "src/documents"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "File", name: "file", widget: "file", hint: "Upload the PDF/DOC/etc. you want visitors to download." }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Body", name: "body", widget: "markdown", required: false }
